<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Launcher Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
/* ───────── Workspace (not part of the head unit) ───────── */
:root{
  --ws-bg:#1b1b1d; --ws-panel:#26262a; --ws-text:#e8e8ec; --ws-dim:#9a9aa2; --ws-line:#3a3a40;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --ws-bg:#d9d9de; --ws-panel:#f4f4f6; --ws-text:#1c1c1e; --ws-dim:#6a6a72; --ws-line:#c4c4cc; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ws-bg);color:var(--ws-text);font-family:Inter,system-ui,sans-serif;font-optical-sizing:auto;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.ws-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 16px;background:var(--ws-panel);border-bottom:1px solid var(--ws-line);font-size:13px}
.ws-bar b{font-weight:650;margin-right:4px}
.ws-group{display:flex;align-items:center;gap:6px}
.ws-group label{color:var(--ws-dim)}
.ws-seg{display:inline-flex;background:var(--ws-bg);border-radius:8px;padding:2px}
.ws-seg button{border:0;background:none;color:var(--ws-dim);font:inherit;padding:4px 10px;border-radius:6px;cursor:pointer}
.ws-seg button[aria-pressed="true"]{background:var(--ws-panel);color:var(--ws-text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.ws-bar select{font:inherit;background:var(--ws-bg);color:var(--ws-text);border:0;border-radius:8px;padding:5px 8px}
.ws-stage{flex:1;display:grid;place-items:center;overflow:hidden;position:relative}
.ws-note{position:absolute;bottom:8px;left:16px;right:16px;font-size:12px;color:var(--ws-dim);text-align:center}
.ws-scaler{position:absolute;left:50%;top:50%;transform-origin:center center}

/* ───────── Head unit design system ───────── */
.hu{
  --ts:1;
  --bg:#000; --tile:#1C1C1E; --fill:#2C2C2E; --fill2:#3A3A3C; --sep:rgba(84,84,88,.6);
  --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.32);
  --red:#FF453A; --green:#30D158; --yellow:#FFD60A; --orange:#FF9F0A;
  --scrim:rgba(0,0,0,.55); --sheet:#1C1C1E; --menu:rgba(44,44,46,.96);
  --r-tile:28px; --r-ctl:16px; --gap:12px;
  position:relative;background:var(--bg);color:var(--label);overflow:hidden;
  display:flex;font-family:Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;
  border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 10px #0c0c0d;
  user-select:none;-webkit-user-select:none;
}
.hu[data-mode="light"]{
  --bg:#F2F2F7; --tile:#FFFFFF; --fill:#E5E5EA; --fill2:#D1D1D6; --sep:rgba(60,60,67,.22);
  --label:#000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --red:#FF3B30; --green:#34C759; --yellow:#FFCC00; --orange:#FF9500;
  --scrim:rgba(0,0,0,.25); --sheet:#F2F2F7; --menu:rgba(250,250,252,.97);
}
.hu ::selection{background:color-mix(in oklab,var(--tint) 45%,transparent)}
.hu :focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.ms{font-family:"Material Symbols Rounded";font-weight:450;font-style:normal;line-height:1;letter-spacing:normal;
  text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";
  font-variation-settings:"FILL" 0,"opsz" 24;display:inline-block}
.ms.f{font-variation-settings:"FILL" 1,"opsz" 24}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* type scale (HIG roles, sized up for arm's length) */
.t-large{font-size:calc(34px*var(--ts));font-weight:700;letter-spacing:-.02em}
.t-title2{font-size:calc(24px*var(--ts));font-weight:650;letter-spacing:-.01em}
.t-head{font-size:calc(19px*var(--ts));font-weight:600}
.t-body{font-size:calc(19px*var(--ts))}
.t-sub{font-size:calc(16px*var(--ts));color:var(--label2)}
.t-foot{font-size:calc(14px*var(--ts));color:var(--label2)}

/* ── Sidebar ── */
.side{flex:0 0 104px;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px;background:var(--bg);container-type:size}
.side .appicon{width:clamp(46px,10cqh,64px);height:clamp(46px,10cqh,64px);border-radius:clamp(11px,2.4cqh,15px)}
.side .appicon .ms{font-size:clamp(26px,5.4cqh,34px)}
.side .nav button{height:clamp(44px,8.6cqh,56px)}
.hu[data-side="bottom"] .side .appicon{width:64px;height:64px}
.hu[data-side="bottom"] .side .nav button{height:56px}
.hu[data-side="right"]{flex-direction:row-reverse}
.hu[data-side="bottom"]{flex-direction:column-reverse}
.hu[data-side="bottom"] .side{flex:0 0 92px;flex-direction:row;padding:0 16px;gap:10px}
.status{display:flex;flex-direction:column;align-items:center;gap:2px}
.status .time{font-size:calc(19px*var(--ts));font-weight:650;line-height:1.2}
.status .sig{display:flex;gap:4px;color:var(--label2)}
.status .sig .ms{font-size:16px}
.hu[data-side="bottom"] .status{flex-direction:row;gap:10px;padding:0 8px 0 0}
.shortcuts{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8cqh,12px);justify-content:center;min-height:0;overflow:hidden}
.hu[data-side="bottom"] .shortcuts{flex-direction:row}
.appicon{width:64px;height:64px;border-radius:15px;display:grid;place-items:center;color:#fff;position:relative;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.08);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.appicon .ms{font-size:34px}
.appicon:active{transform:scale(.92)}
.appicon.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--fill2);color:var(--label3)}
.nav{display:flex;flex-direction:column;gap:6px;background:var(--tile);border-radius:22px;padding:6px}
.hu[data-side="bottom"] .nav{flex-direction:row}
.nav button{width:64px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--label2);transition:background .2s,color .2s}
.nav button .ms{font-size:30px}
.nav button[aria-current="page"]{background:var(--fill);color:var(--label)}
.nav button[aria-current="page"] .ms{font-variation-settings:"FILL" 1,"opsz" 24}

/* ── Main pane + screen transition ── */
.main{flex:1;min-width:0;min-height:0;position:relative}
.wall{position:absolute;inset:0;z-index:0;background:radial-gradient(120% 90% at 70% 110%,#c96f3b 0%,#7a3f4f 32%,#26304f 62%,#0d1424 100%);}
.wall::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
.hu[data-mode="light"] .wall::after{background:rgba(242,242,247,var(--dim))}
.hu.has-wall .side,.hu.has-wall .main{position:relative;z-index:1;background:transparent}
.hu.has-wall{--tile:rgba(28,28,30,.62);--fill:rgba(255,255,255,.12);--np-bg:rgba(28,28,30,.62)!important}
.hu.has-wall[data-mode="light"]{--tile:rgba(255,255,255,.7);--fill:rgba(0,0,0,.08);--np-bg:rgba(255,255,255,.7)!important}
.hu.has-wall .tile,.hu.has-wall .nav,.hu.has-wall .zone,.hu.has-wall .fanzone,.hu.has-wall .tg,.hu.has-wall .rows,.hu.has-wall .s-group{-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4)}
.screen{position:absolute;inset:0;animation:screenIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes screenIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* ── Home grid ── */
.home{display:flex;flex-direction:column}
.editbar{display:flex;align-items:center;gap:12px;padding:0 var(--gap);height:0;overflow:hidden;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.home.editing .editbar{height:76px}
.editbar .grow{flex:1}
.pill{height:52px;padding:0 22px;border-radius:26px;background:var(--fill);font-weight:600;font-size:calc(18px*var(--ts));display:inline-flex;align-items:center;gap:8px}
.pill.primary{background:var(--tint);color:var(--on-tint)}
.pill .ms{font-size:24px}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:var(--gap);padding:var(--gap);min-height:0;position:relative}
.home.editing .grid{padding-top:4px}
.cells{position:absolute;inset:var(--gap);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:var(--gap);pointer-events:none;opacity:0;transition:opacity .2s}
.home.editing .grid .cells{inset:0 var(--gap) var(--gap)}
.dragging .cells{opacity:1}
.cells i{border-radius:var(--r-tile);box-shadow:inset 0 0 0 2px var(--fill)}
.cells i.target{background:color-mix(in oklab,var(--tint) 18%,transparent);box-shadow:inset 0 0 0 2px var(--tint)}
.tile{position:relative;background:var(--tile);border-radius:var(--r-tile);container-type:size;min-width:0;min-height:0;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.home.editing .tile{transform:scale(.97)}
.tile.lifted{z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.45);transition:none}
.badge{position:absolute;z-index:3;width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--fill2);color:var(--label);
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;pointer-events:none}
.home.editing .badge{opacity:1;transform:none;pointer-events:auto}
.badge.rm{top:-10px;left:-10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.badge.sz{bottom:-10px;right:-10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.badge .ms{font-size:24px}

/* widget internals use container units so any span reads */
.w{position:absolute;inset:0;padding:clamp(16px,7cqmin,28px);display:flex;flex-direction:column;border-radius:inherit;overflow:hidden}
.clock .num{font-size:calc(min(42cqh,27cqw)*var(--ts));font-weight:650;letter-spacing:-.035em;line-height:.95;margin-top:auto}
.clock .date{font-size:calc(min(10cqh,7.2cqw,24px)*var(--ts));color:var(--label2);margin-top:8px;font-weight:500}
.clock svg{margin:auto;height:82cqh;width:auto}
.wx .top{display:flex;justify-content:space-between;align-items:flex-start}
.wx .sym{font-size:calc(min(26cqh,18cqw));}
.wx .temp{font-size:calc(min(40cqh,26cqw)*var(--ts));font-weight:600;letter-spacing:-.03em;line-height:1;margin-top:auto}
.wx .cond{font-size:calc(min(9.5cqh,7cqw,22px)*var(--ts));font-weight:600;margin-top:6px}
.wx .hl{font-size:calc(min(8.5cqh,6.4cqw,20px)*var(--ts));color:var(--label2);margin-top:2px}
.offline{margin:auto;text-align:center;color:var(--label2);display:flex;flex-direction:column;align-items:center;gap:10px}
.offline .ms{font-size:44px;color:var(--label3)}
.cmp{align-items:center;justify-content:center;gap:2.5cqh}
.cmp svg{width:min(78cqw,52cqh);height:auto}
.cmp .hdg{font-size:calc(min(9cqh,17cqw)*var(--ts));font-weight:650;letter-spacing:-.02em}
.cmp .spd{font-size:calc(min(5.4cqh,9cqw,24px)*var(--ts));color:var(--label2)}
.np{flex-direction:row;align-items:center;gap:clamp(16px,5cqw,32px);background:var(--np-tint)}
.np .art{flex:0 0 auto;height:min(78cqh,40cqw);aspect-ratio:1;border-radius:14px;background:var(--art);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.np .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.np .src{display:flex;align-items:center;gap:6px;font-size:calc(14px*var(--ts));color:var(--label2);font-weight:500}
.np .src .ms{font-size:18px}
.np .title{font-size:calc(min(14cqh,30px)*var(--ts));font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .artist{font-size:calc(min(9.5cqh,21px)*var(--ts));color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .bar{height:6px;border-radius:3px;background:rgba(127,127,127,.28);margin-top:min(7cqh,22px);overflow:hidden}
.np .bar i{display:block;height:100%;background:var(--label);border-radius:3px}
.np .times{display:flex;justify-content:space-between;font-size:calc(13px*var(--ts));color:var(--label2);margin-top:6px}
.np .ctl{display:flex;align-items:center;gap:6px}
.cbtn{width:64px;height:64px;border-radius:32px;display:grid;place-items:center}
.cbtn .ms{font-size:40px}
.cbtn.play{width:76px;height:76px;border-radius:38px;background:rgba(127,127,127,.24)}
.cbtn.play .ms{font-size:46px}
.cbtn:active{background:rgba(127,127,127,.2)}
@container (max-width:640px){ .np .art{display:none} }
@container (max-width:380px){ .np{flex-direction:column;align-items:stretch} .np .ctl{justify-content:space-between} }
.idle{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.idle .row{display:flex;gap:10px}
.big1{font-size:calc(min(38cqh,26cqw)*var(--ts));font-weight:650;letter-spacing:-.035em;line-height:1;margin-top:auto}
.unit{font-size:calc(min(10cqh,7cqw,24px)*var(--ts));color:var(--label2);font-weight:500;margin-top:6px}
.stat{display:flex;flex-direction:column;gap:14px;margin-top:auto}
.stat .r{display:flex;align-items:center;gap:12px;font-size:calc(17px*var(--ts))}
.stat .r span:first-child{width:64px;color:var(--label2)}
.stat .r b{width:56px;text-align:right;font-weight:600}
.meter{flex:1;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--label2)}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1}
.pad{border-radius:18px;background:var(--fill);font-weight:600;font-size:calc(17px*var(--ts));display:grid;place-items:center}
.pad:active{background:var(--tint);color:var(--on-tint)}
.pad.add{background:none;box-shadow:inset 0 0 0 2px var(--fill);color:var(--label3)}
.radio .bands{display:flex;gap:6px;margin-top:auto}
.seg{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:600;font-size:calc(15px*var(--ts));color:var(--label2)}
.seg button[aria-pressed="true"]{background:var(--tile);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hu[data-mode="dark"] .seg button[aria-pressed="true"]{background:#636366}
.wtitle{display:flex;align-items:center;gap:6px;font-size:calc(15px*var(--ts));font-weight:600;color:var(--label2)}
.wtitle .ms{font-size:20px}

/* ── Sheets, menus ── */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(92%,1100px);max-height:88%;background:var(--sheet);border-radius:28px 28px 0 0;z-index:21;
  display:flex;flex-direction:column;animation:sheetUp .42s cubic-bezier(.32,.72,0,1)}
@keyframes sheetUp{from{transform:translate(-50%,100%)}}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--fill2);margin:10px auto 0}
.sheet-h{display:flex;align-items:center;padding:12px 24px 8px;gap:12px}
.sheet-h .grow{flex:1}
.sheet-b{overflow:auto;padding:8px 24px 24px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{background:var(--tile);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:150px}
.hu[data-mode="light"] .gcard{background:#fff}
.gcard .ms{font-size:34px;color:var(--tint);margin-bottom:auto}
.gcard[disabled]{opacity:.45;cursor:default}
.gcard .added{color:var(--label2);font-size:calc(14px*var(--ts));display:flex;align-items:center;gap:4px}
.menu{position:absolute;z-index:31;min-width:280px;background:var(--menu);border-radius:16px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.4);
  animation:menuIn .22s cubic-bezier(.2,.8,.2,1);transform-origin:top left;backdrop-filter:blur(30px)}
@keyframes menuIn{from{opacity:0;transform:scale(.9)}}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;padding:0 18px;font-size:calc(18px*var(--ts));text-align:left;gap:16px}
.menu button + button{box-shadow:inset 0 .5px 0 var(--sep)}
.menu .gapline{height:8px;background:rgba(0,0,0,.18)}
.menu .danger{color:var(--red)}
.menu button[disabled]{color:var(--label3);cursor:default}
.menu .ms{font-size:24px}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:var(--menu);padding:12px 20px;border-radius:24px;z-index:40;
  font-weight:600;font-size:calc(16px*var(--ts));box-shadow:0 10px 30px rgba(0,0,0,.35);animation:menuIn .2s}

/* ── Apps ── */
.page{display:flex;flex-direction:column;padding:22px 28px 0}
.page-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.page-h .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;height:48px;width:min(360px,40%);background:var(--tile);border-radius:14px;padding:0 14px;color:var(--label2);font-size:calc(18px*var(--ts))}
.hu[data-mode="light"] .search{background:var(--fill)}
.search input{flex:1;background:none;border:0;color:var(--label);font:inherit;outline:none;min-width:0}
.search input::placeholder{color:var(--label2)}
.apps{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:22px 12px;padding:24px 0 28px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:10px;font-size:calc(15px*var(--ts));text-align:center;border-radius:18px;padding:6px 2px}
.app .appicon{width:76px;height:76px;border-radius:18px}
.app .appicon .ms{font-size:40px}
.empty-state{grid-column:1/-1;text-align:center;color:var(--label2);padding:60px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-state .ms{font-size:48px;color:var(--label3)}
.picker-h{display:flex;align-items:center;gap:14px;background:color-mix(in oklab,var(--tint) 16%,var(--tile));border-radius:18px;padding:10px 10px 10px 20px;margin-bottom:6px}
.picker-h .grow{flex:1}

/* ── Climate ── */
.clim{display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-rows:1fr auto;gap:var(--gap);padding:var(--gap)}
.zone{background:var(--tile);border-radius:var(--r-tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;container-type:size;padding:12px}
.zone .lbl{font-size:calc(17px*var(--ts));color:var(--label2);font-weight:600}
.zone .tmp{font-size:calc(min(34cqh,30cqw)*var(--ts));font-weight:650;letter-spacing:-.04em;line-height:1}
.zone .stp{display:flex;gap:16px;margin-top:10px}
.stepb{width:76px;height:64px;border-radius:20px;background:var(--fill);display:grid;place-items:center}
.stepb .ms{font-size:38px}
.stepb:active{background:var(--fill2)}
.stepb[disabled]{opacity:.35}
.fanzone{background:var(--tile);border-radius:var(--r-tile);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:20px 26px}
.fanrow{display:flex;align-items:center;gap:14px}
.segs{flex:1;display:flex;gap:6px;height:56px;align-items:flex-end}
.segs i{flex:1;border-radius:6px;background:var(--fill)}
.segs i.on{background:var(--tint)}
.airrow{display:flex;gap:10px}
.airrow button{flex:1;height:64px;border-radius:18px;background:var(--fill);display:grid;place-items:center;color:var(--label2)}
.airrow button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.airrow .ms{font-size:32px}
.toggles{grid-column:1/-1;display:flex;gap:var(--gap)}
.tg{flex:1;height:96px;border-radius:22px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--label2);font-weight:600;font-size:calc(15px*var(--ts))}
.tg .ms{font-size:34px}
.tg[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.tg .ab{font-size:calc(26px*var(--ts));font-weight:750;letter-spacing:.01em}
.hu[data-mode="dark"] .tg[aria-pressed="true"],.hu[data-mode="dark"] .airrow button[aria-pressed="true"]{background:color-mix(in oklab,var(--tint) 30%,var(--tile));color:color-mix(in oklab,var(--tint) 55%,#fff)}
.clim.off .zone .tmp,.clim.off .segs{opacity:.35}

/* ── Settings (split view, inset grouped) ── */
.settings{display:flex}
.s-list{flex:0 0 340px;overflow:auto;padding:22px 16px 22px 22px}
.s-list .t-large{padding:0 8px 14px}
.s-group{background:var(--tile);border-radius:16px;overflow:hidden;margin-bottom:22px}
.s-item{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 14px;text-align:left;font-size:calc(18px*var(--ts));position:relative}
.s-item + .s-item::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:var(--sep)}
.s-item[aria-current="true"]{background:var(--tint);color:var(--on-tint)}
.s-item[aria-current="true"]::before,.s-item[aria-current="true"] + .s-item::before{display:none}
.sq{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.sq .ms{font-size:22px;font-variation-settings:"FILL" 1}
.s-detail{flex:1;overflow:auto;padding:22px 28px 40px 12px}
.s-detail .t-large{padding:0 0 14px 4px}
.gh{font-size:calc(14px*var(--ts));color:var(--label2);padding:0 18px 8px;text-transform:uppercase;letter-spacing:.02em}
.gf{font-size:calc(14px*var(--ts));color:var(--label2);padding:8px 18px 0;line-height:1.35}
.sec{margin-bottom:30px}
.rows{background:var(--tile);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:16px;min-height:64px;padding:10px 18px;position:relative;font-size:calc(18px*var(--ts));width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;left:18px;right:0;height:.5px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.row .val{color:var(--label2)}
.row .chev{color:var(--label3);font-size:26px}
.row .sub{display:block;font-size:calc(15px*var(--ts));color:var(--label2);margin-top:2px}
.row.danger{color:var(--red);justify-content:center}
.row.link{color:var(--tint)}
.ok{color:var(--green);display:flex;align-items:center;gap:6px}
.sw{width:64px;height:38px;border-radius:19px;background:var(--fill2);position:relative;transition:background .2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:16px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.sw[aria-checked="true"]{background:var(--green)}
.sw[aria-checked="true"]::after{transform:translateX(26px)}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:44px;height:44px;border-radius:22px;position:relative}
.swatch[aria-checked="true"]::after{content:"";position:absolute;inset:-5px;border-radius:50%;box-shadow:0 0 0 3px var(--label2)}
.slider{display:flex;align-items:center;gap:14px;width:100%}
.slider input{flex:1;-webkit-appearance:none;appearance:none;height:32px;background:transparent;cursor:pointer}
.slider input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(var(--tint),var(--tint)) 0/var(--p,50%) 100% no-repeat,var(--fill2)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:15px;background:#fff;margin-top:-12px;box-shadow:0 2px 8px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.06)}
.field{background:var(--fill);border:0;border-radius:12px;height:44px;padding:0 14px;font:inherit;color:var(--label);width:240px;outline:none}
.handle{color:var(--label3);font-size:26px;cursor:grab}
.mini{width:40px;height:40px;border-radius:10px}
.mini .ms{font-size:24px}

/*MOTION*/
/* ───────── Motion (mirrors ui/theme/Motion.kt) ─────────
   feedback 150ms · state 240ms · expo ease-out · pop spring · settle spring · 700ms theme dissolve */
.hu{--ease-out:cubic-bezier(.16,1,.3,1);--pop:cubic-bezier(.34,1.45,.64,1)}
/* Edit jiggle: the one repeating motion, parked-only. `rotate` is its own property, so it
   composes with the tile's edit-mode scale instead of fighting it. */
@keyframes jiggle{0%{rotate:-.35deg}50%{rotate:.35deg}100%{rotate:-.35deg}}
.home.editing .tile:not(.lifted){animation:jiggle .52s ease-in-out infinite}
.hu[data-capture-nojiggle] .home.editing .tile{animation:none}
.home.editing .tile:nth-child(3n){animation-delay:-.17s}
.home.editing .tile:nth-child(3n+1){animation-delay:-.35s}
.home.editing .tile:nth-child(4n){animation-duration:.56s}
/* Entering edit mode: badges pop, the bar opens */
@keyframes badgePop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:none}}
/* Two beats: the bar opens and the grid settles, then badges pop onto a still grid */
.home.edit-in .badge{animation:badgePop .42s var(--pop) .14s both}
.home.edit-in .badge.sz{animation-delay:.18s}
@keyframes barOpen{from{height:0}}
.home.edit-in .editbar{animation:barOpen .3s var(--ease-out)}
/* Menus grow from their anchor corner */
.menu{animation:menuPop .3s var(--pop);transform-origin:var(--origin,top left)}
@keyframes menuPop{from{opacity:0;transform:scale(.86)}}
.menu.leaving,.scrim.leaving{animation:menuOut .11s ease-in forwards;pointer-events:none}
@keyframes menuOut{to{opacity:0;transform:scale(.94)}}
/* Segmented thumb slides: while a thumb is in flight the target button stays clear */
/* Each digit sits in its own clipped cell (always, so rolling never shifts layout) */
.tmp .dg{display:inline-block;position:relative;clip-path:inset(-.06em -.3em)}
.tmp .dg>span{display:block}
.tmp .dg>.ghost{position:absolute;inset:0}
.seg{position:relative}
.seg button{position:relative;z-index:1}
.seg .thumb{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:9px;background:var(--tile);box-shadow:0 1px 3px rgba(0,0,0,.2);pointer-events:none}
.hu[data-mode="dark"] .seg .thumb{background:#636366}
.seg button.thumb-hold{background:transparent!important;box-shadow:none!important}
/* Reduced motion, from the OS or the workspace toggle: cuts, no jiggle */
.hu[data-motion="reduced"] *,.hu[data-motion="reduced"] *::before,.hu[data-motion="reduced"] *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
.hu[data-motion="reduced"] .tile{animation:none!important}
/* While the palette fades, element colour transitions would chase it frame by frame; let them ride it */
.hu[data-theming] *{transition:none!important}

@media (prefers-reduced-motion: reduce){
  .hu .home.editing .tile,.hu .home.editing .tile:not(.lifted){animation:none!important}
  .hu *,.hu *::before,.hu *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
</style>

<body>
<div class="ws-bar" role="toolbar" aria-label="Mockup controls">
  <b>Open Launcher mockup</b>
  <div class="ws-group"><label for="preset">Screen</label>
    <select id="preset">
      <option value="1600x597">TS10 2400×896 (1600×597 dp)</option>
      <option value="1280x480">1920×720 (1280×480 dp)</option>
      <option value="1280x720">1280×720</option>
      <option value="1024x600">1024×600</option>
    </select></div>
  <div class="ws-group"><label>Theme</label><span class="ws-seg" data-ws="mode"><button data-v="dark">Night</button><button data-v="light">Day</button></span></div>
  <div class="ws-group"><label>Sidebar</label><span class="ws-seg" data-ws="side"><button data-v="left">Left</button><button data-v="right">Right</button><button data-v="bottom">Bottom</button></span></div>
  <div class="ws-group"><label>Media</label><span class="ws-seg" data-ws="media"><button data-v="playing">Playing</button><button data-v="idle">Nothing</button><button data-v="carplay">CarPlay</button></span></div>
  <div class="ws-group"><label>Motion</label><span class="ws-seg" data-ws="motion"><button data-v="full">Full</button><button data-v="reduced">Reduced</button></span></div>
  <div class="ws-group"><label>Speed</label><span class="ws-seg" data-ws="speed"><button data-v="1">1×</button><button data-v="0.25">¼×</button></span></div>
  <div class="ws-group"><label>Network</label><span class="ws-seg" data-ws="online"><button data-v="1">Online</button><button data-v="0">Offline</button></span></div>
  <div class="ws-group"><button class="ws-seg" style="padding:4px 10px;color:var(--ws-text)" id="reset">Reset</button></div>
</div>
<div class="ws-stage" id="stage">
  <div class="ws-scaler" id="scaler"><div class="hu" id="hu"></div></div>
  <div class="ws-note">Long-press a widget or a sidebar app to edit. Drag widgets in edit mode. All data is synthetic.</div>
</div>

<script>
const TINTS = {
  blue:{dark:'#0A84FF',light:'#007AFF',name:'Blue'}, indigo:{dark:'#5E5CE6',light:'#5856D6',name:'Indigo'},
  purple:{dark:'#BF5AF2',light:'#AF52DE',name:'Purple'}, pink:{dark:'#FF375F',light:'#FF2D55',name:'Pink'},
  red:{dark:'#FF453A',light:'#FF3B30',name:'Red'}, orange:{dark:'#FF9F0A',light:'#FF9500',name:'Orange'},
  yellow:{dark:'#FFD60A',light:'#FFCC00',name:'Yellow'}, green:{dark:'#30D158',light:'#34C759',name:'Green'},
  teal:{dark:'#40C8E0',light:'#30B0C7',name:'Teal'}, graphite:{dark:'#8E8E93',light:'#8E8E93',name:'Graphite'}
};
const WIDGETS = {
  CLOCK:{name:'Clock',desc:'Time and date',icon:'schedule',span:[1,1]},
  WEATHER:{name:'Weather',desc:'Current conditions',icon:'partly_cloudy_day',span:[1,1]},
  TELEMETRY:{name:'Compass',desc:'Heading and speed',icon:'explore',span:[1,2]},
  NOW_PLAYING:{name:'Now Playing',desc:'Media controls',icon:'music_note',span:[2,1]},
  RADIO:{name:'Radio',desc:'Head unit tuner',icon:'radio',span:[1,1]},
  SPEEDOMETER:{name:'Speed',desc:'GPS speed',icon:'speed',span:[1,1]},
  ALTIMETER:{name:'Altitude',desc:'Elevation, pitch and roll',icon:'landscape',span:[1,1]},
  TRIP_TRACKER:{name:'Trip',desc:'Distance and time',icon:'route',span:[1,1]},
  VITALS:{name:'Vitals',desc:'Head unit CPU, memory, heat',icon:'memory',span:[1,1]},
  SOUNDBOARD:{name:'Soundboard',desc:'Six sound pads',icon:'graphic_eq',span:[1,1]}
};
const APPS = [
  ['CarPlay','#34C759','#0B8F35','directions_car'],['Android Auto','#4285F4','#1A56C8','navigation'],
  ['Spotify','#1ED760','#0E8A3C','graphic_eq'],['YouTube Music','#FF3B30','#B3140C','play_circle'],
  ['Waze','#33CCFF','#0B8CC4','map'],['Maps','#5AC8FA','#2D7FD9','location_on'],
  ['Radio','#FF375F','#B4123A','radio',1],['Bluetooth Music','#0A84FF','#0050B5','bluetooth',1],
  ['Phone','#34C759','#0B8F35','call',1],['Camera','#8E8E93','#48484A','videocam',1],
  ['Equalizer','#FF9F0A','#C46A00','equalizer',1],['Files','#5E5CE6','#3634A3','folder'],
  ['Chrome','#FFCC00','#E08F00','language'],['Gallery','#BF5AF2','#7A2BA8','photo'],
  ['Video','#FF453A','#A2120B','movie',1],['Settings','#8E8E93','#48484A','settings',1],
  ['Termux','#3A3A3C','#1C1C1E','terminal'],['Podcasts','#BF5AF2','#8126B3','podcasts']
];
const DEFAULT_LAYOUT = () => [
  {id:'CLOCK',x:0,y:0,w:1,h:1},{id:'WEATHER',x:1,y:0,w:1,h:1},
  {id:'TELEMETRY',x:2,y:0,w:1,h:2},{id:'NOW_PLAYING',x:0,y:1,w:2,h:1}
];
const DEFAULT_SHORTCUTS = () => ['Radio','Camera','Spotify','Phone'];
const initial = () => ({
  screen:'home', mode:'dark', side:'left', media:'playing', online:true, preset:'1600x597',
  tint:'blue', ts:1, uiScale:1, dayNight:'auto', units:'imperial', clockStyle:'digital', vehicle:'Sylvie',
  layout:DEFAULT_LAYOUT(), shortcuts:DEFAULT_SHORTCUTS(), editing:false, gallery:false,
  playing:true, progress:.38, appsFilter:'installed', query:'', picker:null,
  carplayApp:'CarPlay', aaApp:'Android Auto', radioApp:'Radio', section:'appearance',
  clim:{fan:3,left:72,right:70,auto:true,ac:true,recirc:false,fdef:false,rdef:false,dual:false,air:'face_floor',rearOpen:false,
        rear:{on:true,auto:true,temp:70,fan:2}},
  wallpaper:false, dim:.55, motion:'full', speed:'1', menu:null, toast:null, band:'FM1', freq:101.5, notif:true, location:true, overlay:false, pads:['Horn','Coin','Jump','Boom',null,null]
});
let S = initial();
try{ const saved = JSON.parse(localStorage.getItem('ol-mock')||'null'); if(saved) S = {...S, ...saved, menu:null, toast:null, gallery:false, editing:false}; }catch(e){}
let save = () => { try{ localStorage.setItem('ol-mock', JSON.stringify(S)); }catch(e){} };

const hu = document.getElementById('hu');
const $ = (s,r=document)=>r.querySelector(s);
const ms = (n,f) => `<span class="ms${f?' f':''}" aria-hidden="true">${n}</span>`;
const tint = () => TINTS[S.tint][S.mode];
const onTint = () => ['yellow','green','teal'].includes(S.tint) || (S.tint==='orange'&&S.mode==='light') ? '#000' : '#fff';
const appBy = n => APPS.find(a=>a[0]===n);
const icon = (n,cls='') => { const a=appBy(n); return a?`<span class="appicon ${cls}" style="background:linear-gradient(160deg,${a[1]},${a[2]})">${ms(a[3],1)}</span>`:`<span class="appicon empty ${cls}">${ms('add')}</span>`; };
const fmtT = v => v<=60?'LO':v>=85?'HI':v+'°';
const digits = t => [...t].map(c=>`<span class="dg"><span>${c}</span></span>`).join('');

/* ── Layout logic (port of computeWidgetMove) ── */
const occ = (L,skip) => { const s=new Set(); L.forEach(w=>{ if(w.id===skip) return; for(let dx=0;dx<w.w;dx++)for(let dy=0;dy<w.h;dy++) s.add((w.x+dx)+','+(w.y+dy)); }); return s; };
const free = (w,h,o) => { for(let y=0;y<2;y++)for(let x=0;x<3;x++){ if(x+w>3||y+h>2) continue; let ok=true; for(let dx=0;dx<w;dx++)for(let dy=0;dy<h;dy++) if(o.has((x+dx)+','+(y+dy))) ok=false; if(ok) return [x,y]; } return null; };
const overlap = (a,b) => a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
function moveWidget(id,tx,ty){
  const m=S.layout.find(w=>w.id===id); if(!m) return;
  const placed={...m,x:Math.max(0,Math.min(3-m.w,tx)),y:Math.max(0,Math.min(2-m.h,ty))};
  const others=S.layout.filter(w=>w.id!==id), res=[placed];
  const stable=others.filter(w=>!overlap(placed,w)), displaced=others.filter(w=>overlap(placed,w));
  stable.forEach(w=>res.push(w));
  displaced.forEach(w=>{ const p=free(w.w,w.h,occ(res)); res.push(p?{...w,x:p[0],y:p[1]}:w); });
  S.layout=res;
}
const fits = (id,w,h) => { const me=S.layout.find(x=>x.id===id); if(me.x+w>3||me.y+h>2) return false; const o=occ(S.layout,id); for(let dx=0;dx<w;dx++)for(let dy=0;dy<h;dy++) if(o.has((me.x+dx)+','+(me.y+dy))) return false; return true; };

/* ── Widgets ── */
function compassSVG(){
  const ticks=[...Array(72)].map((_,i)=>{const a=i*5,l=i%6===0?14:7;return `<line x1="100" y1="10" x2="100" y2="${10+l}" stroke="var(${i%6===0?'--label2':'--label3'})" stroke-width="${i%6===0?2.5:1.5}" stroke-linecap="round" transform="rotate(${a} 100 100)"/>`}).join('');
  const lbl=(t,a,c)=>`<text x="100" y="44" text-anchor="middle" font-size="17" font-weight="700" fill="var(${c})" transform="rotate(${a} 100 100)" font-family="Inter">${t}</text>`;
  return `<svg viewBox="0 0 200 200" role="img" aria-label="Heading 312 degrees northwest"><g transform="rotate(-312 100 100)">${ticks}${lbl('N',0,'--red')}${lbl('E',90,'--label2')}${lbl('S',180,'--label2')}${lbl('W',270,'--label2')}</g>
  <path d="M100 58 L114 112 L100 104 L86 112 Z" fill="var(--label)"/><line x1="100" y1="2" x2="100" y2="22" stroke="var(--tint)" stroke-width="4" stroke-linecap="round"/></svg>`;
}
function analogSVG(){
  const t=[...Array(12)].map((_,i)=>`<line x1="100" y1="14" x2="100" y2="${i%3?24:30}" stroke="var(--label${i%3?3:2})" stroke-width="${i%3?3:5}" stroke-linecap="round" transform="rotate(${i*30} 100 100)"/>`).join('');
  return `<svg viewBox="0 0 200 200" role="img" aria-label="7:42">${t}<line x1="100" y1="100" x2="100" y2="54" stroke="var(--label)" stroke-width="8" stroke-linecap="round" transform="rotate(231 100 100)"/><line x1="100" y1="100" x2="100" y2="30" stroke="var(--label)" stroke-width="5" stroke-linecap="round" transform="rotate(252 100 100)"/><circle cx="100" cy="100" r="6" fill="var(--tint)"/></svg>`;
}
const W = {
  CLOCK:()=> S.clockStyle==='analog' ? `<div class="w clock">${analogSVG()}</div>` :
    `<div class="w clock"><span class="wtitle">${ms('directions_car',1)}${S.vehicle}</span><div class="num">7:42</div><div class="date">Sunday, November 16</div></div>`,
  WEATHER:()=> !S.online ? `<div class="w"><div class="offline">${ms('cloud_off')}<span class="t-sub">Weather needs a connection</span></div></div>` :
    `<div class="w wx"><div class="top"><span class="wtitle">${ms('near_me',1)}My Location</span><span class="ms f sym" style="color:var(--label)" aria-hidden="true">bedtime</span></div>
     <div class="temp">${S.units==='imperial'?'52°':'11°'}</div><div class="cond">Clear</div><div class="hl">H:${S.units==='imperial'?'61° L:44°':'16° L:7°'}</div></div>`,
  TELEMETRY:()=>`<div class="w cmp">${compassSVG()}<div class="hdg">312° NW</div><div class="spd">${S.units==='imperial'?'42 mph':'68 km/h'}</div></div>`,
  NOW_PLAYING:()=>{
    if(S.media==='carplay') return `<div class="w"><div class="idle">${icon('CarPlay')}<div class="t-title2">CarPlay is connected</div><div class="t-sub">Media and navigation are on your phone</div><button class="pill primary" data-a="launch" data-v="CarPlay">Open CarPlay</button></div></div>`;
    if(S.media==='idle') return `<div class="w"><div class="idle"><div class="t-title2">Not Playing</div><div class="row" style="display:flex;gap:10px"><button class="pill" data-a="launch" data-v="Spotify">${ms('graphic_eq')}Spotify</button><button class="pill" data-a="launch" data-v="Radio">${ms('radio')}Radio</button></div></div></div>`;
    return `<div class="w np" style="--art:linear-gradient(145deg,#2f4a63 0%,#7c5c8a 55%,#d08a5a 100%);--np-tint:var(--np-bg)">
      <div class="art" role="img" aria-label="Album artwork"></div>
      <div class="meta"><span class="src">${ms('graphic_eq')}Spotify</span><div class="title">It's Time</div><div class="artist">Imagine Dragons</div>
      <div class="bar"><i style="width:${S.progress*100}%"></i></div><div class="times"><span>1:30</span><span>−2:28</span></div></div>
      <div class="ctl"><button class="cbtn" aria-label="Previous track" data-a="noop">${ms('skip_previous',1)}</button>
      <button class="cbtn play" aria-label="${S.playing?'Pause':'Play'}" data-a="play">${ms(S.playing?'pause':'play_arrow',1)}</button>
      <button class="cbtn" aria-label="Next track" data-a="noop">${ms('skip_next',1)}</button></div></div>`;
  },
  RADIO:()=>`<div class="w radio"><span class="wtitle">${ms('radio')}${S.band}</span><div class="big1">${S.band==='AM'?'1010':S.freq.toFixed(1)}</div><div class="unit">${S.band==='AM'?'kHz':'MHz'}</div>
     <div class="bands" style="justify-content:space-between;align-items:center"><button class="cbtn" aria-label="Seek down" data-a="seek" data-v="-1">${ms('fast_rewind',1)}</button><span class="seg">${['FM1','FM2','AM'].map(b=>`<button aria-pressed="${S.band===b}" data-a="band" data-v="${b}">${b}</button>`).join('')}</span><button class="cbtn" aria-label="Seek up" data-a="seek" data-v="1">${ms('fast_forward',1)}</button></div></div>`,
  SPEEDOMETER:()=>`<div class="w"><span class="wtitle">${ms('speed')}Speed</span><div class="big1">${S.units==='imperial'?42:68}</div><div class="unit">${S.units==='imperial'?'mph':'km/h'}</div></div>`,
  ALTIMETER:()=>`<div class="w"><span class="wtitle">${ms('landscape')}Altitude</span><div class="big1">${S.units==='imperial'?'1,050':'320'}</div><div class="unit">${S.units==='imperial'?'ft':'m'} · pitch 2° · roll 1°</div></div>`,
  TRIP_TRACKER:()=>`<div class="w"><span class="wtitle">${ms('route')}Trip</span><div class="big1">${S.units==='imperial'?'12.4':'20.0'}</div><div class="unit">${S.units==='imperial'?'mi':'km'} · 28 min</div></div>`,
  VITALS:()=>`<div class="w"><span class="wtitle">${ms('memory')}Head unit</span><div class="stat">
     <div class="r"><span>CPU</span><span class="meter"><i style="width:23%"></i></span><b>23%</b></div>
     <div class="r"><span>Memory</span><span class="meter"><i style="width:61%"></i></span><b>61%</b></div>
     <div class="r"><span>Heat</span><span class="meter"><i style="width:48%;background:var(--orange)"></i></span><b>${S.units==='imperial'?'118°':'48°'}</b></div></div></div>`,
  SOUNDBOARD:()=>`<div class="w"><div class="pads">${S.pads.map(p=>p?`<button class="pad" data-a="noop">${p}</button>`:`<button class="pad add" aria-label="Assign a sound">${ms('add')}</button>`).join('')}</div></div>`
};

/* ── Screens ── */
function sidebar(){

  return `<nav class="side" aria-label="Sidebar">
    <div class="status"><span class="time">7:42</span><span class="sig">${S.online?ms('wifi'):ms('wifi_off')}${ms('bluetooth')}</span></div>
    <div class="shortcuts">${S.shortcuts.map((n,i)=>`<button aria-label="${n||'Add shortcut'}" data-a="short" data-v="${i}" data-lp="shortmenu">${n?icon(n):icon(null)}</button>`).join('')}</div>

/* ── Render ── */
/* ── Motion layer ──────────────────────────────────────────────────────────
   render() rebuilds the head unit's DOM, so nothing can transition by itself. Each render
   snapshots what is on screen, rebuilds, then animates the difference:
   tiles glide (FLIP), colours fade from their old values, segmented thumbs slide,
   temperatures roll, menus leave, and day/night dissolves through a View Transition. */
const reduced = () => S.motion==='reduced' || matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.16,1,.3,1)', SETTLE = 'cubic-bezier(.22,1,.36,1)';
const rate = () => +S.speed || 1;
const anim = (el,kf,o) => { if(!el) return; const a=el.animate(kf,{...o,duration:o.duration/rate(),delay:(o.delay||0)/rate()}); return a; };
const COLOR_SEL = '.nav button, .tg, .airrow button, .segs i, .stepb';
const keyOf = el => {
  if(el.matches('.segs i')) return 'bar:'+el.parentElement.dataset.k+':'+[...el.parentElement.children].indexOf(el);
  return (el.dataset.a||el.className)+':'+(el.dataset.v||'')+':'+(el.getAttribute('aria-label')||'');
};
function snapshot(){
  const snap={tiles:{},colors:{},segs:[],temps:{},bars:{},menu:null,editing:!!$('.home.editing'),mode:hu.dataset.mode};
  hu.querySelectorAll('.tile[data-id]').forEach(t=>snap.tiles[t.dataset.id]=t.getBoundingClientRect());
  hu.querySelectorAll(COLOR_SEL).forEach(el=>{const cs=getComputedStyle(el);const ic=el.querySelector('.ms');snap.colors[keyOf(el)]={bg:cs.backgroundColor,fg:cs.color,fvs:ic?getComputedStyle(ic).fontVariationSettings:null};});
  hu.querySelectorAll('.segs[data-k]').forEach(g=>snap.bars[g.dataset.k]=g.querySelectorAll('i.on').length);
  hu.querySelectorAll('.seg').forEach(g=>{const b=g.querySelector('button[aria-pressed="true"]');const gr=g.getBoundingClientRect();
    snap.segs.push(b?{i:[...g.querySelectorAll('button')].indexOf(b),l:b.getBoundingClientRect().left-gr.left,w:b.getBoundingClientRect().width}:null);});
  hu.querySelectorAll('.tmp[data-k]').forEach(t=>snap.temps[t.dataset.k]=t.getAttribute('aria-label'));
  const m=hu.querySelector('.menu'); if(m) snap.menu=m.cloneNode(true);
  return snap;
}
function animateFrom(snap){
  if(reduced()) return;
  const s=(+$('#scaler').dataset.s||1)*S.uiScale;
  // 1. Edit mode entry: badges pop, bar opens (CSS, keyed by a one-shot class)
  const homeEl=$('.home');
  if(homeEl && S.editing && !snap.editing){ homeEl.classList.add('edit-in'); setTimeout(()=>homeEl.classList.remove('edit-in'),700/rate()); }
  // 2. Tiles glide: FLIP from where each one was (a dropped tile starts where it was released)
  hu.querySelectorAll('.tile[data-id]').forEach(t=>{
    const a=snap.tiles[t.dataset.id]; if(!a) return;
    const b=t.getBoundingClientRect();
    if(Math.abs(a.left-b.left)<1 && Math.abs(a.top-b.top)<1 && Math.abs(a.width-b.width)<1 && Math.abs(a.height-b.height)<1) return;
    const sEnd=S.editing?.97:1, lw=t.offsetWidth, lh=t.offsetHeight;
    const dx=((a.left+a.width/2)-(b.left+b.width/2))/s, dy=((a.top+a.height/2)-(b.top+b.height/2))/s;
    t.style.zIndex=4;
    const an=anim(t,[{transform:`translate(${dx}px,${dy}px) scale(${a.width/s/lw},${a.height/s/lh})`},{transform:`scale(${sEnd})`}],{duration:420,easing:SETTLE});
    an&&an.finished.then(()=>t.style.zIndex='').catch(()=>{});
  });
  // 3. Colours fade from their old values: nav selection (and its icon fill), toggles, fan bars.
  //    Fan bars run in sequence counted from the first bar that changed.
  hu.querySelectorAll(COLOR_SEL).forEach(el=>{
    const old=snap.colors[keyOf(el)]; if(!old) return; const cs=getComputedStyle(el);
    if(old.bg===cs.backgroundColor && old.fg===cs.color) return;
    let delay=0;
    if(el.matches('.segs i')){ const i=[...el.parentElement.children].indexOf(el), prev=snap.bars[el.parentElement.dataset.k]??0,
      now=el.parentElement.querySelectorAll('i.on').length; delay=18*Math.max(0, now>=prev ? i-prev : prev-1-i); }
    anim(el,[{backgroundColor:old.bg,color:old.fg},{backgroundColor:cs.backgroundColor,color:cs.color}],{duration:240,delay,easing:EASE,fill:'backwards'});
    const ic=el.querySelector('.ms'); if(ic && old.fvs){ const now=getComputedStyle(ic).fontVariationSettings;
      if(now!==old.fvs) anim(ic,[{fontVariationSettings:old.fvs},{fontVariationSettings:now}],{duration:240,easing:EASE}); }
  });
  // 4. Segmented thumbs slide between segments
  hu.querySelectorAll('.seg').forEach((g,gi)=>{
    const was=snap.segs[gi], b=g.querySelector('button[aria-pressed="true"]'); if(!was||!b) return;
    const btns=[...g.querySelectorAll('button')]; if(btns.indexOf(b)===was.i) return;
    const gr=g.getBoundingClientRect(), br=b.getBoundingClientRect();
    const th=document.createElement('i'); th.className='thumb'; g.prepend(th); b.classList.add('thumb-hold');
    // Labels change colour with the thumb, not ahead of it
    const oldOn=btns[was.i], onC=getComputedStyle(b).color, offC=oldOn?getComputedStyle(oldOn).color:onC;
    anim(b,[{color:offC},{color:onC}],{duration:160,delay:80,easing:'ease-out',fill:'backwards'});
    if(oldOn) anim(oldOn,[{color:onC},{color:offC}],{duration:120,easing:'ease-out',fill:'backwards'});
    const an=anim(th,[{left:was.l/s+'px',width:was.w/s+'px'},{left:(br.left-gr.left)/s+'px',width:br.width/s+'px'}],{duration:240,easing:EASE,fill:'forwards'});
    const done=()=>{th.remove();b.classList.remove('thumb-hold');}; an?an.finished.then(done).catch(done):done();
  });
  // 5. Temperatures roll like an odometer: only changed digits move, each in its own clipped
  //    cell, old and new one line apart on the same curve. Shape changes (LO/HI) cross-fade.
  hu.querySelectorAll('.tmp[data-k]').forEach(t=>{
    const before=snap.temps[t.dataset.k], now=t.getAttribute('aria-label'); if(before===undefined||before===now) return;
    const f=parseFloat(before), n=parseFloat(now), dir=isNaN(f)||isNaN(n)?0:(n>f?1:-1);
    if(!dir || before.length!==now.length){ anim(t,[{opacity:0},{opacity:1}],{duration:240,easing:EASE}); return; }
    const cells=t.querySelectorAll('.dg');
    [...now].forEach((ch,i)=>{ if(before[i]===ch) return; const cell=cells[i], cur=cell.firstElementChild, h=cell.offsetHeight*1.1;
      const ghost=document.createElement('span'); ghost.className='ghost'; ghost.textContent=before[i]; cell.appendChild(ghost);
      const o={duration:300,easing:EASE};
      anim(cur,[{transform:`translateY(${dir*h}px)`},{transform:'none'}],{...o,fill:'backwards'});
      const g=anim(ghost,[{transform:'none'},{transform:`translateY(${-dir*h}px)`}],{...o,fill:'forwards'});
      g?g.finished.then(()=>ghost.remove()).catch(()=>ghost.remove()):ghost.remove(); });
  });
  // 6. A closed menu fades out instead of vanishing
  if(snap.menu && !hu.querySelector('.menu')){ const m=snap.menu; m.classList.add('leaving'); hu.appendChild(m); setTimeout(()=>m.remove(),160/rate()); }
}
const THEME_VARS=['--bg','--tile','--fill','--fill2','--sep','--label','--label2','--label3','--red','--green','--yellow','--orange','--scrim','--sheet','--menu','--tint','--on-tint','--np-bg'];
const TEXT_VARS=new Set(['--label','--label2','--label3','--on-tint']);
const cctx=document.createElement('canvas').getContext('2d');
const rgba=c=>{ cctx.fillStyle='#000'; cctx.fillStyle=c; const v=cctx.fillStyle; if(v[0]==='#') return [parseInt(v.slice(1,3),16),parseInt(v.slice(3,5),16),parseInt(v.slice(5,7),16),1]; const m=v.match(/[\d.]+/g).map(Number); return [m[0],m[1],m[2],m[3]??1]; };
const mix=(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t);
const css=c=>`rgba(${c[0].toFixed(1)},${c[1].toFixed(1)},${c[2].toFixed(1)},${c[3].toFixed(3)})`;
const lum=c=>{ const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}; return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2]); };
const bez=(x1,y1,x2,y2)=>t=>{ let a=t; for(let i=0;i<8;i++){ const x=3*x1*a*(1-a)**2+3*x2*a*a*(1-a)+a**3-t, dx=3*x1*(1-a)**2+6*(x2-x1)*a*(1-a)+3*(1-x2)*a*a; if(Math.abs(dx)<1e-6) break; a-=x/dx; } return 3*y1*a*(1-a)**2+3*y2*a*a*(1-a)+a**3; };
const fastOutSlowIn=bez(.4,0,.2,1);
const readVars=()=>{ const cs=getComputedStyle(hu); return Object.fromEntries(THEME_VARS.map(v=>[v,rgba(cs.getPropertyValue(v).trim()||'#000')])); };
// Registered as <color> so the tokens themselves can be animated (and measured) as Web Animations
try{ THEME_VARS.forEach(v=>CSS.registerProperty({name:v,syntax:'<color>',inherits:true,initialValue:'transparent'})); }catch(e){}
let themeAnims=[], themeT=0;
function themeFade(fromVals,oldMode){
  // Surfaces fade for 700ms; text tokens and mode-specific styling flip in a ~70ms window where
  // the tile crosses mid-luminance (0.18), so numerals never fade into a matching grey.
  themeAnims.forEach(a=>a.cancel()); clearTimeout(themeT);
  const newMode=S.mode, toVals=readVars();
  const startDark=lum(fromVals['--tile'])<=.18; let tc=.5;
  for(let i=1;i<=50;i++){ const t=i/50; if((lum(mix(fromVals['--tile'],toVals['--tile'],t))<=.18)!==startDark){ tc=t; break; } }
  let rtc=.5; for(let i=1;i<=200;i++){ if(fastOutSlowIn(i/200)>=tc){ rtc=i/200; break; } }   // eased progress → time
  const surf=THEME_VARS.filter(v=>!TEXT_VARS.has(v)), text=THEME_VARS.filter(v=>TEXT_VARS.has(v));
  const kf=(vars,vals)=>Object.fromEntries(vars.map(v=>[v,css(vals[v])]));
  const dur=700/rate();
  themeAnims=[
    hu.animate([kf(surf,fromVals),kf(surf,toVals)],{duration:dur,easing:'cubic-bezier(.4,0,.2,1)'}),
    hu.animate([{offset:0,...kf(text,fromVals)},{offset:Math.max(0,rtc-.05),...kf(text,fromVals)},{offset:Math.min(1,rtc+.05),...kf(text,toVals)},{offset:1,...kf(text,toVals)}],{duration:dur})
  ];
  hu.dataset.mode=oldMode; hu.dataset.theming=''; themeT=setTimeout(()=>{ hu.dataset.mode=newMode; },dur*rtc);
  Promise.all(themeAnims.map(a=>a.finished)).then(()=>delete hu.dataset.theming).catch(()=>{});
}
function render(){
  const snap=snapshot();
  const themeChange = snap.mode && snap.mode!==S.mode && !reduced();
  hu.dataset.motion = reduced()?'reduced':'full';
  // Capture tooling needs finite motion; #nojiggle=true records edit entry without the loop
  if(S.nojiggle) hu.dataset.captureNojiggle=''; else delete hu.dataset.captureNojiggle;

  // never see a transition-enabled style mid-fade

}
function applyRate(){ if(rate()===1) return; hu.getAnimations({subtree:true}).forEach(a=>{ if(!a._r){a.playbackRate=rate();a._r=1;} }); }
hu.addEventListener('animationstart',applyRate); hu.addEventListener('transitionrun',applyRate);

function doRender(){
  const t=tint();
  hu.dataset.mode=S.mode; hu.dataset.side=S.side;
  hu.style.setProperty('--tint',t); hu.style.setProperty('--on-tint',onTint()); hu.style.setProperty('--ts',S.ts);
  hu.style.setProperty('--np-bg',S.mode==='dark'?'#222c36':'#e2e9f0');
  const [w,h]=S.preset.split('x').map(Number);
  hu.style.width=(w/S.uiScale)+'px'; hu.style.height=(h/S.uiScale)+'px'; hu.style.zoom=S.uiScale;
  const scr={home,apps,climate,settings}[S.screen]();
  const prev=hu.dataset.screen; hu.dataset.screen=S.screen;
  const detailScroll=$('#detail')?.scrollTop;
  hu.classList.toggle('has-wall',!!S.wallpaper); hu.style.setProperty('--dim',S.mode==='dark'?Math.min(.9,S.dim+.15):S.dim);
  hu.innerHTML = (S.wallpaper?'<div class="wall" aria-hidden="true"></div>':'') + sidebar() + `<main class="main">${scr}</main>` + (S.gallery?gallery():'') + menuHTML() + (S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
  if(prev===S.screen) hu.querySelectorAll('.screen').forEach(s=>s.style.animation='none');
  if(detailScroll && $('#detail')) $('#detail').scrollTop=detailScroll;
  document.querySelectorAll('.ws-seg[data-ws]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(S[g.dataset.ws])===b.dataset.v || (g.dataset.ws==='online' && (S.online?'1':'0')===b.dataset.v))));
  $('#preset').value=S.preset;
  fit(); save();
}
function fit(){
  const st=$('#stage').getBoundingClientRect(); const [w,h]=S.preset.split('x').map(Number);
  const s=Math.min((st.width-48)/w,(st.height-60)/h,1); $('#scaler').style.transform=`translate(-50%,-50%) scale(${s})`; $('#scaler').dataset.s=s;
}
addEventListener('resize',()=>fit());
let toastT; const toast=m=>{S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render();},1800);};
const menuAt=(el,o)=>{const r=el.getBoundingClientRect(),hr=hu.getBoundingClientRect(),s=+$('#scaler').dataset.s*S.uiScale;
  let x=(r.right-hr.left)/s+8,y=(r.top-hr.top)/s; const W_=hu.offsetWidth,H_=hu.offsetHeight; let ox='left',oy='top'; if(x+290>W_){ x=(r.left-hr.left)/s-290; ox='right'; } if(y+300>H_){ y=Math.max(12,H_-310); oy='bottom'; } S.menu={...o,x,y,origin:oy+' '+ox};render();};

/* ── Actions ── */
const A={
  go:v=>{S.screen=v;S.editing=false;S.menu=null;if(v!=='apps')S.picker=null;},
  play:()=>{S.playing=!S.playing;}, noop:()=>{},
  launch:v=>{toast(`Opening ${v}`);return 1;},
  short:v=>{const n=S.shortcuts[+v]; if(n) {toast(`Opening ${n}`);return 1;} A.assign(v);},
  gallery:()=>{S.gallery=true;}, closegal:()=>{S.gallery=false;},
  done:()=>{S.editing=false;}, rm:v=>{S.layout=S.layout.filter(w=>w.id!==v);},
  add:v=>{const sp=WIDGETS[v].span;let p=free(sp[0],sp[1],occ(S.layout)),w=sp[0],h=sp[1];if(!p){p=free(1,1,occ(S.layout));w=h=1;} if(p){S.layout.push({id:v,x:p[0],y:p[1],w,h});S.gallery=false;}},
  szmenu:(v,el)=>{menuAt(el,{type:'size',id:v});return 1;},
  resize:v=>{const [id,w,h]=v.split(',');const m=S.layout.find(x=>x.id===id);m.w=+w;m.h=+h;S.menu=null;},
  closemenu:()=>{S.menu=null;},
  filter:v=>{S.appsFilter=v;}, section:v=>{S.section=v;},
  set:v=>{const [k,val]=v.split(',');S[k]=val;S.menu=null; if(k==='dayNight'){ if(val==='light')S.mode='light'; if(val==='dark')S.mode='dark'; }},
  tint:v=>{S.tint=v;}, sw:v=>{S[v]=!S[v];},
  grant:v=>{S[v]=true;},
  editfromsettings:()=>{S.screen='home';S.editing=true;},
  assign:v=>{S.picker={slot:+v,label:'a shortcut app'};S.screen='apps';S.menu=null;},
  pickcp:()=>{S.picker={key:'carplayApp',label:'CarPlay app'};S.screen='apps';},
  pickaa:()=>{S.picker={key:'aaApp',label:'Android Auto app'};S.screen='apps';},
  pickradio:()=>{S.picker={key:'radioApp',label:'Radio app'};S.screen='apps';S.appsFilter='all';},
  pick:v=>{const p=S.picker; if(p.key){S[p.key]=v;S.screen='settings';} else {S.shortcuts[p.slot]=v;S.screen=p.back||'home';} S.picker=null;},
  cancelpick:()=>{S.picker=null;S.screen='settings';},
  addslot:()=>{S.shortcuts.push(null);},
  rmshort:v=>{S.shortcuts[+v]=null;S.menu=null;},
  moveshort:v=>{const [i,d]=v.split(',').map(Number),j=i+d;if(j>=0&&j<S.shortcuts.length){[S.shortcuts[i],S.shortcuts[j]]=[S.shortcuts[j],S.shortcuts[i]];}S.menu=null;},
  toast:v=>{toast(v);return 1;},
  resetask:(v,el)=>{menuAt(el,{type:'reset'});return 1;},
  reset:()=>{const keep={preset:S.preset,mode:S.mode};S=initial();Object.assign(S,keep);S.screen='settings';S.section='about';},
  temp:v=>{const [z,d]=v.split(',');const k=(z==='right'&&!S.clim.dual)?(S.clim.dual=true,'right'):z;S.clim[k]=Math.max(60,Math.min(85,S.clim[k]+ +d));},
  fan:v=>{S.clim.fan=Math.max(0,Math.min(7,S.clim.fan+ +v));S.clim.auto=false;},
  air:v=>{S.clim.air=v;S.clim.auto=false;},
  ctog:v=>{const c=S.clim; if(v==='off'){c.fan=c.fan?0:3;} else c[v]=!c[v]; if(v==='auto'&&c.auto&&!c.fan)c.fan=3;},
  rearopen:()=>{S.clim.rearOpen=true;}, rearback:()=>{S.clim.rearOpen=false;},
  rtemp:v=>{S.clim.rear.temp=Math.max(60,Math.min(85,S.clim.rear.temp+ +v));},
  rfan:v=>{S.clim.rear.fan=Math.max(0,Math.min(7,S.clim.rear.fan+ +v));S.clim.rear.auto=false;},
  rtog:v=>{S.clim.rear[v]=!S.clim.rear[v];},
  band:v=>{S.band=v;}, seek:v=>{S.freq=Math.round((S.freq+ +v*0.2)*10)/10;}
};
hu.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return;}
  const el=e.target.closest('[data-a]'); if(!el||el.disabled) return;
  const r=A[el.dataset.a]?.(el.dataset.v,el); if(!r) render();
});
hu.addEventListener('input',e=>{
  const k=e.target.dataset.in; if(!k) return;
  if(k==='vehicle'){S.vehicle=e.target.value;save();return;}
  S[k]=parseFloat(e.target.value); render(); const inp=hu.querySelector(`[data-in="${k}"]`); inp&&inp.focus();
});
hu.addEventListener('input',e=>{ if(e.target.id==='q'){S.query=e.target.value;render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length);} });

/* ── Long-press + drag ── */
let lpT=null, start=null, drag=null, suppressClick=false;
hu.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.matches('.tile') && !S.editing){ e.preventDefault(); S.editing=true; render(); } });
hu.addEventListener('pointerdown',e=>{
  const lp=e.target.closest('[data-lp]'); if(!lp||e.target.closest('.badge')) return;
  start={x:e.clientX,y:e.clientY,el:lp};
  if(S.editing && lp.classList.contains('tile')) { beginDrag(lp,e); return; }
  lpT=setTimeout(()=>{ suppressClick=true;
    if(lp.dataset.lp==='edit'){ S.editing=true; S.screen='home'; render(); }
    else if(lp.dataset.lp==='shortmenu'){ menuAt(lp,{type:'short',i:+lp.dataset.v}); }
  },480);
});
hu.addEventListener('pointermove',e=>{
  if(lpT && start && Math.hypot(e.clientX-start.x,e.clientY-start.y)>10){clearTimeout(lpT);lpT=null;}
  if(drag){ const s=+$('#scaler').dataset.s*S.uiScale; drag.el.style.transform=`translate(${(e.clientX-drag.x)/s}px,${(e.clientY-drag.y)/s}px) scale(1.03)`;
    const c=cellAt(e); hu.querySelectorAll('.cells i').forEach(i=>i.classList.toggle('target', c && i.dataset.c===`${c[0]-drag.ox},${c[1]-drag.oy}`)); }
});
addEventListener('pointerup',e=>{
  clearTimeout(lpT); lpT=null;
  if(drag){ const c=cellAt(e), moved=Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8; const id=drag.id; $('#grid')?.classList.remove('dragging'); drag=null;
    if(moved){ suppressClick=true; if(c) moveWidget(id,c[0]-drag_o.ox,c[1]-drag_o.oy); render(); setTimeout(()=>suppressClick=false,0);} else render(); }
  start=null;
});
let drag_o={};
function cellAt(e){const g=$('#grid')?.getBoundingClientRect(); if(!g) return null; const x=Math.floor((e.clientX-g.left)/g.width*3), y=Math.floor((e.clientY-g.top)/g.height*2); return (x<0||x>2||y<0||y>1)?null:[x,y];}
function beginDrag(el,e){
  const w=S.layout.find(x=>x.id===el.dataset.id), c=cellAt(e)||[w.x,w.y];
  drag={el,id:w.id,x:e.clientX,y:e.clientY,ox:c[0]-w.x,oy:c[1]-w.y}; drag_o=drag;
  el.classList.add('lifted'); $('#grid').classList.add('dragging'); el.setPointerCapture?.(e.pointerId);
}

/* ── Workspace controls ── */
document.querySelectorAll('.ws-seg[data-ws]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.ws;
  S[k]= k==='online'? b.dataset.v==='1' : b.dataset.v; if(k==='mode') S.dayNight=b.dataset.v==='dark'?'dark':'light'; if(k==='media'&&b.dataset.v==='playing') S.playing=true; render();}));
$('#preset').addEventListener('change',e=>{S.preset=e.target.value;render();});
$('#reset').addEventListener('click',()=>{S=initial();render();});
/* #bare&screen=climate&mode=light… renders the device alone at 1:1 for captures */
if(location.hash.length>1){
  const p=new URLSearchParams(location.hash.slice(1));
  for(const [k,v] of p){ if(k==='bare') continue; S[k]= v==='true'?true: v==='false'?false: isNaN(+v)?v:+v; }
  if(p.has('bare')){ S=Object.assign(initial(),Object.fromEntries([...p].filter(([k])=>k!=='bare').map(([k,v])=>[k,v==='true'?true:v==='false'?false:isNaN(+v)?v:+v])));
    document.querySelector('.ws-bar').style.display='none'; document.querySelector('.ws-note').style.display='none';
    const st=document.getElementById('stage'); st.style.placeItems='start'; fit=()=>{ const sc=$('#scaler'); sc.style.transform='none'; sc.style.left='0'; sc.style.top='0'; sc.dataset.s=1; };
    hu.style.borderRadius='0'; hu.style.boxShadow='none'; save=()=>{}; }
}
document.fonts?.ready.then(fit);
render();
